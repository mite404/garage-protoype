name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signal_desk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/signal_desk_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/signal_desk_test
      FALLOW_AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install text-PDF support
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm ci
      - run: npm run build
      - name: Check against the running application
        env:
          TEST_APP_URL: http://127.0.0.1:3000
        run: |
          npm run start -- --hostname 127.0.0.1 > "$RUNNER_TEMP/app.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 30 --retry-connrefused --retry-delay 1 --retry-all-errors \
            --fail --silent --show-error "$TEST_APP_URL" > /dev/null || {
              cat "$RUNNER_TEMP/app.log"
              exit 1
            }
          npm run check
