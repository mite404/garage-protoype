name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signal_desk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/signal_desk_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/signal_desk_test
      FALLOW_AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build the Cloudflare streaming Worker
        run: npm run cloudflare:build
      - name: Check against the running application
        env:
          TEST_APP_URL: http://127.0.0.1:3000
        run: |
          npm run start -- --hostname 127.0.0.1 > "$RUNNER_TEMP/app.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 30 --retry-connrefused --retry-delay 1 --retry-all-errors \
            --fail --silent --show-error "$TEST_APP_URL" > /dev/null || {
              cat "$RUNNER_TEMP/app.log"
              exit 1
            }
          npm run check
      - name: Check streaming and import guarantees on the Cloudflare Worker
        run: npm run test:cloudflare
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      # Its own database: npm test owns signal_desk_test, and fixtures cannot share one.
      - name: Drive the specialist funnel in a browser
        env:
          E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/signal_desk_e2e_test
        run: npm run test:e2e
      - name: Keep the funnel recording and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-funnel
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
      # Last: OpenNext reruns `next build`, which would replace the build the checks started.
      - name: Build the website Worker
        run: npm run website:build
      - name: Show Cloudflare Worker logs
        if: failure()
        run: cat apps/web/cloudflare/.wrangler/test-worker.log || true
